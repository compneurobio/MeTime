name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: false

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhdf5-dev libcurl4-gnutls-dev libssl-dev libxml2-dev \
            libpng-dev libxt-dev zlib1g-dev libbz2-dev liblzma-dev \
            libglpk40 libgit2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libjpeg-dev libtiff5-dev libwebp-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: any::pkgdown

      - name: Install Bioconductor dependencies
        run: |
          Rscript -e 'install.packages("BiocManager", repos = "https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install(version = "3.18", ask = FALSE, update = FALSE)'
          Rscript -e 'BiocManager::install(c("preprocessCore", "impute", "M3C", "WGCNA"), ask = FALSE, update = FALSE, force = TRUE)'

      - name: Sync docs to vignettes
        run: Rscript tools/sync_docs_to_vignettes.R

      - name: Build site
        run: Rscript -e 'pkgdown::build_site(preview = FALSE, devel = TRUE, examples = FALSE, install = FALSE, new_process = FALSE)'

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs/site

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/site
