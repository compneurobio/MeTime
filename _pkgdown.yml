destination: docs/site
url: https://compneurobio.github.io/MeTime/
template:
  bootstrap: 5

authors:
  footer:
    roles: [aut, cre]

navbar:
  structure:
    left: [get-started, reference, articles, developer]
    right: [search, github]
  components:
    get-started:
      text: Get started
      href: articles/getting-started-quickstart.html
    developer:
      text: Developer docs
      menu:
        - text: Docs Hub (source)
          href: https://github.com/compneurobio/MeTime/tree/main/docs

articles:
  - title: Getting started
    contents:
      - starts_with("getting-started-")
  - title: User guides
    contents:
      - starts_with("user-guides-")
  - title: Reference guides
    contents:
      - starts_with("reference-")
  - title: Case studies
    contents:
      - starts_with("case-studies-")
  - title: Developer
    contents:
      - starts_with("developer-")
